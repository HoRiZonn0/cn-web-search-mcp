[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cn-web-search-mcp"
version = "0.4.0"
description = "Autonomous Chinese web research service with MCP and REST APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "mcp>=1.27,<2",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "uvicorn>=0.31,<1",
]

[project.urls]
Repository = "https://github.com/HoRiZonn0/cn-web-search-mcp"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
cn-web-search-api = "cn_web_search_mcp.api_main:main"
cn-web-search-mcp = "cn_web_search_mcp.__main__:main"
cn-web-search-provision = "cn_web_search_mcp.provision:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cn_web_search_mcp"]

[tool.hatch.build]
include = [
  "src/cn_web_search_mcp/**/*.py",
  "src/cn_web_search_mcp/data/*.md",
  "src/cn_web_search_mcp/data/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
